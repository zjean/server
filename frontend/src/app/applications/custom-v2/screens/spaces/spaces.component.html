<div class="spaces">
  <header class="spaces__toolbar">
    <app-v2-icon-btn iconName="refresh" [size]="30" title="Refresh" (click)="refresh()" />
    <app-v2-icon-btn iconName="plus" [size]="30" title="Create space" (click)="createSpace()" />
    <app-v2-icon-btn iconName="more" [size]="30" title="More" [disabled]="true" />
    <div class="spaces__toolbar-meta">
      {{ spaces().length }} space{{ spaces().length === 1 ? '' : 's' }}
    </div>
  </header>

  @if (loading()) {
    <div class="spaces__state">Loading…</div>
  } @else if (errorMessage(); as err) {
    <div class="spaces__state spaces__state--error">{{ err }}</div>
  } @else if (spaces().length === 0) {
    <div class="spaces__state">You don't belong to any spaces yet.</div>
  } @else {
    <div class="space-table">
      <div class="space-table__head">
        <span>Name</span>
        <span>Quota</span>
        <span>Members</span>
        <span>Modified</span>
        <span></span>
      </div>
      @for (s of sortedSpaces(); track s.id) {
        <button type="button" class="space-row" (click)="openSpace(s)">
          <div class="space-row__name">
            <span class="space-row__glyph">
              <app-v2-icon name="box" [size]="15" />
            </span>
            <div class="space-row__meta">
              <div class="space-row__title">{{ s.name }}</div>
              @if (s.description) {
                <div class="space-row__description">{{ s.description }}</div>
              }
            </div>
          </div>
          <div class="space-row__quota">
            @if (s.storageQuota && s.storageQuota > 0) {
              {{ s.storageUsage | toBytes: 1 : true }} / {{ s.storageQuota | toBytes }}
            } @else {
              {{ s.storageUsage | toBytes: 1 : true }}
            }
          </div>
          <div class="space-row__members">{{ memberCount(s) }}</div>
          <div class="space-row__modified">
            @if (s.modifiedAt) {
              <app-v2-pill color="violet" [size]="11">{{ s.modifiedAt | amTimeAgo }}</app-v2-pill>
            }
          </div>
          <div class="space-row__actions">
            <app-v2-icon-btn iconName="more" [size]="24" />
          </div>
        </button>
      }
    </div>
  }
</div>
