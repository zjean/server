<div class="favorites">
  <header class="favorites__header">
    <h1 class="v2-page-title" l10nTranslate>Favorites</h1>
    <p class="favorites__meta">
      <span class="favorites__meta-count">{{ favorites().length }}</span>
      <span l10nTranslate>items</span>
    </p>
  </header>

  @if (hasAny()) {
    <section class="favorites__section">
      <app-v2-section-head label="Starred" [count]="favorites().length" />

      <div class="favorites__list">
        @for (f of favorites(); track f.fileId) {
          <app-v2-file-row
            [name]="f.name"
            [mime]="f.mime"
            [isDir]="f.isDir"
            [serverPath]="navPath(f)"
            [path]="locationPath(f) || (originKey(f) | translate: locale.language)"
            [pathIcon]="originIcon(f)"
            [pathIconLabel]="originKey(f) | translate: locale.language"
            [mtime]="f.mtime"
            [now]="renderedAt"
            [disabled]="f.isDisabled"
            (open)="openFavorite(f)"
            (aux)="openFavoriteInNewTab(f)"
          >
            @if (f.isDisabled) {
              <!-- Upstream could not resolve this favorite to a location the user can
                   still reach. Mirrors classic's warning badge rather than hiding the
                   row, so it can be seen and removed. -->
              <span rowBadges class="favorites__stale" l10nTranslate>No longer accessible</span>
            }

            <!-- Actionable, not decorative: on a screen called "Starred" the star is
                 the only affordance that makes sense, and it is the ONLY way to clear
                 a disabled favorite — that row cannot be reached through the file
                 browser to unstar it there. -->
            <button
              rowActions
              type="button"
              class="favorites__unstar"
              [title]="'Remove from favorites' | translate: locale.language"
              [attr.aria-label]="'Remove from favorites' | translate: locale.language"
              (click)="removeFavorite(f)"
            >
              <app-v2-icon name="star" [size]="14" />
            </button>
          </app-v2-file-row>
        }
      </div>
    </section>
  } @else {
    <app-v2-empty-state icon="star" title="No favorites yet" lede="Star a file or folder from the file browser and it will show up here." />
  }
</div>
