@if (loading()) {
  <div class="diagram-view__state" l10nTranslate>Loading diagram…</div>
} @else if (errorMessage()) {
  <div class="diagram-view__state diagram-view__state--error">{{ errorMessage() | translate: locale.language }}</div>
} @else if (iframeSrc()) {
  <iframe
    #editorFrame
    class="diagram-view__frame"
    [src]="iframeSrc()"
    [title]="'Diagram editor' | translate: locale.language"
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads"
  ></iframe>
}

@if (conflict()) {
  <div class="diagram-conflict__backdrop" (click)="cancelConflict()" (contextmenu)="$event.preventDefault()"></div>
  <div
    class="diagram-conflict"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'Conflict — someone else saved this diagram' | translate: locale.language"
    (click)="$event.stopPropagation()"
  >
    <div class="diagram-conflict__title" l10nTranslate>Conflict — someone else saved this diagram</div>
    <div class="diagram-conflict__message" l10nTranslate>
      Your unsaved edits are still on the canvas. Pick one:
    </div>
    <div class="diagram-conflict__actions">
      <button type="button" class="diagram-conflict__btn diagram-conflict__btn--ghost" (click)="cancelConflict()">
        {{ 'Cancel' | translate: locale.language }}
      </button>
      <button type="button" class="diagram-conflict__btn diagram-conflict__btn--ghost" (click)="discardMine()">
        {{ 'Discard mine' | translate: locale.language }}
      </button>
      <button type="button" class="diagram-conflict__btn diagram-conflict__btn--primary" (click)="keepMine()">
        {{ 'Keep mine' | translate: locale.language }}
      </button>
    </div>
  </div>
}
