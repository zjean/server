@if (tabs().length > 0) {
  <nav class="dock-rail" [attr.aria-label]="'File panels' | translate: locale.language">
    @for (t of tabs(); track t.id) {
      <button
        type="button"
        class="dock-rail__tab"
        [class.dock-rail__tab--active]="active === t.id"
        [attr.title]="t.label"
        (click)="toggle(t.id)"
      >
        <app-v2-icon [name]="t.icon" [size]="15" />
      </button>
    }
  </nav>
}
