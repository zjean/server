<app-v2-title-bar>
  <app-v2-transfers-popover titleBarRight />
</app-v2-title-bar>
<div class="layout-v2__body">
  <app-v2-app-rail />
  <app-v2-left-nav />
  <main class="layout-v2__content">
    <router-outlet />
  </main>
  @if (dockActive()) {
    <aside class="layout-v2__dock-panel">
      <div class="layout-v2__dock-panel-header">{{ dockActive() }}</div>
      <p class="layout-v2__dock-panel-empty">Coming soon.</p>
    </aside>
  }
  <app-v2-dock-rail [active]="dockActive()" (dockChange)="onDockChange($event)" />
</div>
<app-v2-toast-host />
<app-v2-confirm-dialog />
<app-v2-tree-picker />
<app-v2-prompt-dialog />
