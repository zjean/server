<!-- A button, not an <a href="#…">: the app uses hash routing, so a fragment
     href would overwrite the current route instead of moving focus. -->
<button type="button" class="layout-v2__skip" (click)="focusMainContent()" l10nTranslate>Skip to content</button>
@if (layoutV2.isMobile()) {
  <app-v2-title-bar>
    <app-v2-transfers-popover titleBarRight />
  </app-v2-title-bar>
}
<div class="layout-v2__body">
  <app-v2-left-nav />
  @if (!layoutV2.isMobile() && layoutV2.sidebarCollapsed() && layoutV2.sidebarOverlay()) {
    <app-v2-left-nav [forceFullRender]="true" />
    <div
      class="layout-v2__backdrop layout-v2__backdrop--desktop"
      (click)="layoutV2.closeSidebarOverlay()"
      aria-hidden="true"
    ></div>
  }
  <main class="layout-v2__content" id="v2-main-content" tabindex="-1">
    @if (!layoutV2.isMobile()) {
      <app-v2-top-bar />
    } @else {
      <app-v2-page-breadcrumb />
    }
    <router-outlet />
  </main>
  @if (layoutV2.dockActive() !== null) {
    <aside
      class="layout-v2__dock-panel"
      [class.layout-v2__dock-panel--open]="layoutV2.dockActive() !== null"
    >
      <app-v2-dock-panel />
    </aside>
  }
  <app-v2-dock-rail [active]="layoutV2.dockActive()" (dockChange)="onDockChange($event)" />
  @if (layoutV2.isMobile() && (layoutV2.leftNavOpen() || layoutV2.dockActive() !== null)) {
    <div
      class="layout-v2__backdrop"
      [class.layout-v2__backdrop--left]="layoutV2.leftNavOpen()"
      [class.layout-v2__backdrop--right]="layoutV2.dockActive() !== null"
      (click)="onBackdropClick()"
      aria-hidden="true"
    ></div>
  }
</div>
<app-v2-bottom-tab-bar />
<app-v2-toast-host />
<app-v2-confirm-dialog />
<app-v2-tree-picker />
<app-v2-prompt-dialog />
<app-v2-compress-dialog />
<app-v2-link-dialog />
<app-v2-share-dialog />
<app-v2-2fa-dialog />
