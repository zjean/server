<div class="title-bar">
  @if (layoutV2.isMobile()) {
    <button
      type="button"
      class="title-bar__brand"
      (click)="onBrandClick()"
      [attr.aria-expanded]="layoutV2.leftNavOpen()"
      aria-controls="v2-left-nav"
      [attr.aria-label]="'Toggle navigation' | translate: locale.language"
    >
      <app-v2-logo [size]="22" />
    </button>
  }
  <div class="title-bar__spacer"></div>
  <div class="title-bar__right">
    <ng-content select="[titleBarRight]"></ng-content>
    <!-- Mobile's inspector affordance. It lived on the icon rail, which is gone;
         phase 7 re-lays-out this bar, but leaving the sheet unreachable in the
         meantime is not a trade worth making. No tooltip — this is a touch
         surface, so the accessible name carries the meaning. -->
    @if (inspector.available()) {
      <app-v2-icon-btn
        iconName="panelRight"
        [size]="30"
        [active]="layoutV2.dockOpen()"
        [ariaLabel]="'Toggle right panel' | translate: locale.language"
        (click)="layoutV2.toggleDock()"
      />
    }
    <app-v2-notifications-bell />
    <div class="title-bar__avatar" [attr.title]="user?.fullName">
      @if (userAvatar) {
        <img class="title-bar__avatar-img" [src]="userAvatar" alt="" />
      } @else {
        {{ userInitials() }}
      }
    </div>
  </div>
</div>
