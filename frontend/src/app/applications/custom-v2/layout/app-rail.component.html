<nav class="app-rail">
  @for (it of items; track it.id) {
    @if (it.route && !it.disabled) {
      <a
        [routerLink]="it.route"
        class="app-rail__item"
        [class.app-rail__item--active]="it.id === activeId()"
        [attr.title]="it.title | translate: locale.language"
      >
        <app-v2-icon [name]="it.icon" [size]="17" />
      </a>
    } @else {
      <button
        type="button"
        class="app-rail__item"
        [disabled]="it.disabled"
        [attr.title]="it.title | translate: locale.language"
      >
        <app-v2-icon [name]="it.icon" [size]="17" />
      </button>
    }
  }
</nav>
