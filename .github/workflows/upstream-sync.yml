name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: upstream-main

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/Sync-in/server.git
          git fetch upstream main

      - name: Fast-forward upstream-main to upstream/main
        id: sync
        run: |
          BEFORE=$(git rev-parse HEAD)
          git reset --hard upstream/main
          AFTER=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "upstream-main: $BEFORE -> $AFTER"
          fi

      # The default GITHUB_TOKEN cannot create or update files under
      # .github/workflows/ — there is no `workflows` permission scope for it.
      # When upstream changes a workflow file the push below is otherwise
      # rejected with a cryptic "refusing to allow a GitHub App ..." error.
      # Detect it here and fail with an actionable message instead. This is an
      # intentional manual gate: upstream workflow changes are reviewed by hand
      # via the sync-in-fork-maintenance skill (recovery: sync from upstream/main).
      - name: Guard — upstream workflow-file changes need a manual sync
        if: steps.sync.outputs.changed == 'true'
        run: |
          if ! git diff --quiet "${{ steps.sync.outputs.before }}" HEAD -- .github/workflows/; then
            echo "::error title=Upstream changed workflow files::The Upstream Sync GITHUB_TOKEN cannot push .github/workflows/* changes (no 'workflows' scope). This is expected. Run the sync-in-fork-maintenance skill and follow its 'Failure mode' recovery: sync manually from upstream/main (NOT the now-stale upstream-main). THEN ADVANCE THE MIRROR — 'git push origin upstream/main:refs/heads/upstream-main' — or this guard keeps firing on the same already-merged changes forever."
            git --no-pager diff --stat "${{ steps.sync.outputs.before }}" HEAD -- .github/workflows/
            exit 1
          fi

      - name: Push upstream-main
        if: steps.sync.outputs.changed == 'true'
        run: git push --force-with-lease origin upstream-main

      # NOT gated on steps.sync.outputs.changed. The mirror can already be current
      # while develop is still behind — after a manual recovery sync advanced the
      # mirror out-of-band, for instance — and gating this on "the mirror moved"
      # turned that state into a green run that did nothing at all. The step's own
      # skip condition below is what decides whether there is anything to open.
      #
      # That condition is an ANCESTRY test, deliberately. It used to be
      # `git diff --quiet origin/develop HEAD`, which compares TREES — and on a
      # fork the two trees always differ, because carrying changes upstream does
      # not have is the entire point. So the skip could never fire, and in the
      # one state it existed to handle (develop already contains upstream-main,
      # e.g. right after a manual recovery sync) the step fell through to
      # `gh pr create` and died on "No commits between develop and upstream-main".
      - name: Open or update PR into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor HEAD origin/develop; then
            echo "develop already contains upstream-main; skipping PR."
            exit 0
          fi

          EXISTING=$(gh pr list --repo "${{ github.repository }}" \
            --state open --base develop --head upstream-main \
            --json number --jq '.[0].number // empty')

          if [ -z "$EXISTING" ]; then
            gh pr create --repo "${{ github.repository }}" \
              --base develop --head upstream-main \
              --title "chore: sync upstream ($(date +%Y-%m-%d))" \
              --body "Automated upstream sync from \`Sync-in/server\`. Review the diff and merge to pull upstream changes into \`develop\`."
          else
            echo "PR #$EXISTING already open; the push updates it automatically."
          fi
