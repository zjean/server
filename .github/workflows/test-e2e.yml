name: E2E Workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Separate from the `test` workflow ON PURPOSE.
#
# `test` is the check branch protection requires, and it must stay fast and
# hermetic. These specs need a real MariaDB and a real filesystem, which is
# exactly what makes them worth running — the versioning bugs that reached a
# green unit suite (a lock stub that could not express "the lock is already
# yours"; a retention db stub that always answered "no quota", leaving 19 green
# tests over a destructive branch that never ran) are all invisible without one.
#
# This check is therefore ADVISORY: a failure shows up on the PR but does not
# block the merge. Promote it into the required set once it has run green for a
# while — the reason to wait is that a DB-backed suite has failure modes (service
# startup, migration drift) that a unit suite does not, and discovering them as a
# hard merge block is a bad first experience.
jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: dev_root
          MARIADB_DATABASE: sync_in
          MARIADB_USER: sync_in
          MARIADB_PASSWORD: dev
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy environment file
        run: |
          cp environment/environment.dist.yaml environment/environment.yaml
          # Storage roots under /tmp — the suite writes real files and reads them
          # back, so it needs a writable data path.
          sed -i "s|dataPath: /home/|dataPath: /tmp/|" environment/environment.yaml
          # Point at the service container.
          sed -i "s|url: 'mysql://user:MySQLPassword@localhost:3306/database'|url: 'mysql://sync_in:dev@127.0.0.1:3307/sync_in'|" environment/environment.yaml
          # Enable OnlyOffice. NOT so documents can be edited — no document server
          # runs here. FilesModule imports OnlyOfficeModule CONDITIONALLY at
          # module-definition time, so with the flag off `app.get(OnlyOfficeManager)`
          # throws and the editor write-path case (E2E-11) cannot resolve the
          # service. That case signs its own callback JWT with the secret already in
          # the dist file and serves the document from a throwaway local HTTP server;
          # host validation only applies when `externalServer` is set, which it isn't.
          #
          # Scoped to the editors.onlyoffice block by a line range, so it cannot
          # flip some other `enabled: false` elsewhere in the file.
          sed -i '/^      onlyoffice:$/,/^      eurooffice:$/ s/^        enabled: false$/        enabled: true/' environment/environment.yaml

      - name: Apply migrations
        run: npm run dev:migrate

      # app.e2e-spec.ts ("AppStaticFiles") asserts that GET / serves the SPA
      # entry point out of STATIC_PATH, which in a test env resolves to
      # dist/static. A stub is enough and is deliberately preferred over
      # `npm run -w frontend build`:
      #
      #   - the assertion the BACKEND owns is "static middleware is wired and the
      #     root route serves the entry point", and a one-line index.html
      #     exercises exactly that;
      #   - the frontend's prebuild step downloads pdf.js at build time (it is
      #     always-latest and gitignored — see PR #272), so building it here would
      #     make a database-backed e2e suite depend on a third-party download.
      #
      # Whether the real bundle builds is the build job's business, not this
      # suite's.
      - name: Stub the static bundle
        run: |
          mkdir -p dist/static
          echo '<!doctype html><title>e2e</title>' > dist/static/index.html

      # The suite sets `files.versions.enabled` itself in each spec's beforeEach
      # rather than relying on the environment file, so no flag flipping is
      # needed here. That is deliberate: a suite whose result depends on a
      # gitignored local file is a suite that passes on one machine.
      - name: Run e2e tests
        run: npm -w backend run test:e2e
