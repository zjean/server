name: E2E Workflow
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Separate from the `test` workflow ON PURPOSE.
#
# `test` is the check branch protection requires, and it must stay fast and
# hermetic. These specs need a real MariaDB and a real filesystem, which is
# exactly what makes them worth running — the versioning bugs that reached a
# green unit suite (a lock stub that could not express "the lock is already
# yours"; a retention db stub that always answered "no quota", leaving 19 green
# tests over a destructive branch that never ran) are all invisible without one.
#
# This check is therefore ADVISORY: a failure shows up on the PR but does not
# block the merge. Promote it into the required set once it has run green for a
# while — the reason to wait is that a DB-backed suite has failure modes (service
# startup, migration drift) that a unit suite does not, and discovering them as a
# hard merge block is a bad first experience.
jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: dev_root
          MARIADB_DATABASE: sync_in
          MARIADB_USER: sync_in
          MARIADB_PASSWORD: dev
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy environment file
        run: |
          cp environment/environment.dist.yaml environment/environment.yaml
          # Storage roots under /tmp — the suite writes real files and reads them
          # back, so it needs a writable data path.
          sed -i "s|dataPath: /home/|dataPath: /tmp/|" environment/environment.yaml
          # Point at the service container.
          #
          # Matched on the `url:` KEY, not on the credential literal. The literal
          # version broke on the 2.5.0 sync: upstream changed the sample from
          # `user:MySQLPassword` to `root:MySQLRootPassword` (8ad87f62), the sed
          # silently matched nothing, the URL kept pointing at :3306 where nothing
          # listens, and the whole suite died at "Apply migrations" with
          # ECONNREFUSED — long before a single test ran.
          sed -i "s|^\([[:space:]]*\)url: 'mysql://.*'|\1url: 'mysql://sync_in:dev@127.0.0.1:3307/sync_in'|" environment/environment.yaml
          # Fail LOUDLY if that ever stops matching again, rather than handing the
          # suite an unusable URL and letting it fail somewhere less obvious.
          grep -q "url: 'mysql://sync_in:dev@127.0.0.1:3307/sync_in'" environment/environment.yaml || {
            echo "::error title=DB url rewrite failed::The mysql url in environment.dist.yaml no longer matches the sed in this workflow. Upstream probably changed its shape; update the pattern."
            grep -n "mysql://" environment/environment.yaml || true
            exit 1
          }
          # Enable OnlyOffice. NOT so documents can be edited — no document server
          # runs here. FilesModule imports OnlyOfficeModule CONDITIONALLY at
          # module-definition time, so with the flag off `app.get(OnlyOfficeManager)`
          # throws and the editor write-path case (E2E-11) cannot resolve the
          # service. That case signs its own callback JWT with the secret already in
          # the dist file and serves the document from a throwaway local HTTP server;
          # host validation only applies when `externalServer` is set, which it isn't.
          #
          # Scoped to the editors.onlyoffice block by a line range, so it cannot
          # flip some other `enabled: false` elsewhere in the file.
          sed -i '/^      onlyoffice:$/,/^      eurooffice:$/ s/^        enabled: false$/        enabled: true/' environment/environment.yaml

      # Upstream 2.5.0 stopped shipping placeholder secrets in the dist file
      # (a654376c): `auth.token.access.secret` and friends are now EMPTY, and config
      # validation rejects that, so every spec file died at import with "Invalid
      # configuration in environment.yaml" before a single test ran.
      #
      # Only four need setting. `auth.token.csrf` / `ws` / `access_2fa` / `csrf_2fa`
      # are DERIVED at runtime from access/refresh and inherit their secrets — which
      # is why this worked while the dist file still carried placeholders.
      #
      # The onlyoffice secret must merely be non-empty: E2E-11 signs its own callback
      # JWT with whatever `configuration.applications.files.editors.onlyoffice.secret`
      # holds at runtime (versions-editors.e2e-spec.ts), so it does not need to match
      # any particular value.
      #
      # Done in node rather than sed because the dist file has several other empty
      # `secret:` keys (ldap, oidc, eurooffice) that a line-oriented match would hit.
      - name: Inject test secrets
        run: |
          node -e "
            const yaml = require('js-yaml'), fs = require('fs');
            const p = 'environment/environment.yaml';
            const c = yaml.load(fs.readFileSync(p, 'utf8'));
            c.auth.encryptionKey = 'e2e-encryption-key';
            c.auth.token.access.secret = 'e2e-access-secret';
            c.auth.token.refresh.secret = 'e2e-refresh-secret';
            c.applications.files.editors.onlyoffice.secret = 'e2e-onlyoffice-secret';
            fs.writeFileSync(p, yaml.dump(c, { lineWidth: -1 }));
          "
          # Same reasoning as the db-url guard: a rewrite that silently no-ops is
          # worse than one that fails, because the symptom lands somewhere unrelated.
          node -e "
            const yaml = require('js-yaml'), fs = require('fs');
            const c = yaml.load(fs.readFileSync('environment/environment.yaml', 'utf8'));
            const missing = [
              ['auth.encryptionKey', c.auth?.encryptionKey],
              ['auth.token.access.secret', c.auth?.token?.access?.secret],
              ['auth.token.refresh.secret', c.auth?.token?.refresh?.secret],
              ['applications.files.editors.onlyoffice.secret', c.applications?.files?.editors?.onlyoffice?.secret]
            ].filter(([, v]) => !v).map(([k]) => k);
            if (missing.length) {
              console.log('::error title=Secret injection failed::empty after injection: ' + missing.join(', '));
              process.exit(1);
            }
          "

      - name: Apply migrations
        run: npm run dev:migrate

      # app.e2e-spec.ts ("AppStaticFiles") asserts that GET / serves the SPA
      # entry point out of STATIC_PATH, which in a test env resolves to
      # dist/static. A stub is enough and is deliberately preferred over
      # `npm run -w frontend build`:
      #
      #   - the assertion the BACKEND owns is "static middleware is wired and the
      #     root route serves the entry point", and a one-line index.html
      #     exercises exactly that;
      #   - the frontend's prebuild step downloads pdf.js at build time (it is
      #     always-latest and gitignored — see PR #272), so building it here would
      #     make a database-backed e2e suite depend on a third-party download.
      #
      # Whether the real bundle builds is the build job's business, not this
      # suite's.
      - name: Stub the static bundle
        run: |
          mkdir -p dist/static
          echo '<!doctype html><title>e2e</title>' > dist/static/index.html

      # The suite sets `files.versions.enabled` itself in each spec's beforeEach
      # rather than relying on the environment file, so no flag flipping is
      # needed here. That is deliberate: a suite whose result depends on a
      # gitignored local file is a suite that passes on one machine.
      - name: Run e2e tests
        run: npm -w backend run test:e2e
