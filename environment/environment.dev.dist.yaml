server:
  host: 0.0.0.0
  port: 8080
  workers: 1
  trustProxy: 1
  restartOnFailure: false

logger:
  level: debug
  stdout: true
  colorize: true
  jsonOutput: false

mysql:
  url: mysql://sync_in:dev@localhost:3307/sync_in
  logQueries: false

cache:
  adapter: mysql
  ttl: 60

websocket:
  adapter: cluster
  corsOrigin: '*'

# Dev-only secrets — safe to commit because this is a template for local machines.
# Generate fresh random values if you're paranoid: `openssl rand -hex 32`.
auth:
  provider: mysql
  encryptionKey: dev-encryption-key-do-not-use-in-prod
  token:
    access:
      secret: dev-access-secret-do-not-use-in-prod
      expiration: 30m
    refresh:
      secret: dev-refresh-secret-do-not-use-in-prod
      expiration: 4h
  mfa:
    totp:
      enabled: true
      issuer: Sync-in
  # Stub LDAP block — only consumed when provider == 'ldap', but its presence
  # is required so that LDAP unit tests can instantiate AuthProviderLDAP.
  ldap:
    servers: []
    baseDN: 'ou=people,dc=example,dc=org'
    filter: ''
    attributes:
      login: uid
      email: mail
    options:
      autoCreateUser: false
      autoCreatePermissions: []
      enablePasswordAuthFallback: true

applications:
  files:
    dataPath: /tmp/sync-in-dev-data
    # `editors.*` is the current shape. The flat `files.onlyoffice` /
    # `files.collabora` keys still work but log a deprecation warning on every
    # boot, which is noise in a dev log and in the e2e output.
    editors:
      # OnlyOffice is ENABLED in dev, and the reason is not "so you can edit
      # documents" — it is that the module is imported CONDITIONALLY at
      # module-definition time (files.module.ts:28). With it off,
      # `app.get(OnlyOfficeManager)` throws, so the versioning e2e case for the
      # editor write path (E2E-11) cannot resolve the service at all.
      #
      # No document server needs to be running. That case drives
      # OnlyOfficeManager.callBack directly with a JWT it signs using this
      # secret, and serves the "saved" document from a throwaway local HTTP
      # server — which is allowed because host validation only kicks in when
      # `externalServer` is set (only-office-manager.service.ts:444).
      onlyoffice:
        enabled: true
        secret: dev-onlyoffice-secret
      collabora:
        enabled: false
    # Fork-owned file versioning (docs/plans/2026-07-25-file-versioning-design.md).
    # Ships off. Set enabled: true to exercise the v2 Versions tab — the tab stays
    # hidden while this is false, because the API 404s and the UI probes for it.
    # A version is only created when a file is OVERWRITTEN, so a fresh file shows
    # an empty history until you save over it.
    # minIntervalSeconds: 0 defeats the coalescing window, which otherwise
    # merges successive test saves into a single version.
    #
    # The window is per-origin (ADR §5). minIntervalSeconds is the fallback for
    # every INTERACTIVE origin — a human pressing Save, where 60s is the right
    # granularity in production. minIntervalSecondsByOrigin overrides it for the
    # editors, whose cadence is set by the document server rather than by a
    # person: Collabora's own defaults save after 30 idle seconds and every 300
    # seconds of continuous typing, so 300 keeps an hour of editing from minting
    # ~10 versions that age-tiered thinning would otherwise have to work through
    # right away.
    #
    # Zero everything for development. Measuring an editor's real cadence needs
    # 0 here too, or you measure the window instead of the editor.
    versions:
      enabled: false
      minIntervalSeconds: 0
      minIntervalSecondsByOrigin:
        collabora: 0
        onlyoffice: 0
